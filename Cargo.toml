[package]
name = "cmake-ls"
version = "0.1.0"
edition = "2024"
description = "List buildable targets from an existing CMake build tree"
readme = "README.md"
keywords = ["cmake", "cli", "build"]
categories = ["command-line-utilities", "development-tools::build-utils"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["poll", "process", "signal"] }

[target.'cfg(windows)'.dependencies]
command-group = "5.0"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = { level = "allow", priority = 1 }
# `command-group` is Windows-only, so its older Unix `nix` dependency is
# never built alongside the current Unix dependency used by `cmake-ls`.
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
